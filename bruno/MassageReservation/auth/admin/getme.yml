info:
  name: Get Me
  type: http
  seq: 3

http:
  method: GET
  url: "{{URL}}/api/v1/auth/me"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.role
      operator: eq
      value: admin

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
