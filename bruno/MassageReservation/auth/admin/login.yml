info:
  name: login
  type: http
  seq: 2

http:
  method: POST
  url: "{{URL}}/api/v1/auth/login"
  body:
    type: json
    data: |-
      {
          "email": "admin02@gmail.com",
          "password": "12345678"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("adminToken", res.body.token);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.role
      operator: eq
      value: admin

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
