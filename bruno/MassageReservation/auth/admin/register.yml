info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/api/v1/auth/register"
  body:
    type: json
    data: |-
      {
          "name": "Admin02",
          "tel": "0812345678",
          "email": "admin02@gmail.com",
          "password": "12345678",
          "role": "admin"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.role
      operator: eq
      value: admin

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
