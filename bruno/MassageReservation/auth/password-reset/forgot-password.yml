info:
  name: Request Reset OTP
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/api/v1/auth/forgot-password"
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: "{{resetEmail}}"
  auth:
    type: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
