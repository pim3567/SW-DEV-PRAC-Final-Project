info:
  name: Reset Password
  type: http
  seq: 3

http:
  method: POST
  url: "{{URL}}/api/v1/auth/reset-password"
  body:
    type: multipart-form
    data:
      - name: resetToken
        type: text
        value: "{{resetToken}}"
      - name: password
        type: text
        value: "{{resetNewPassword}}"
      - name: confirmPassword
        type: text
        value: "{{resetConfirmPassword}}"
  auth:
    type: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
