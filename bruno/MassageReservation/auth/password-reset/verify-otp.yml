info:
  name: Verify Reset OTP
  type: http
  seq: 2

http:
  method: POST
  url: "{{URL}}/api/v1/auth/verify-otp"
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: "{{resetEmail}}"
      - name: otp
        type: text
        value: "{{resetOtp}}"
  auth:
    type: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body.success && res.body.resetToken) {
          bru.setVar("resetToken", res.body.resetToken);
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
