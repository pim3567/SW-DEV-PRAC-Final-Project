info:
  name: logout
  type: http
  seq: 4

http:
  method: GET
  url: "{{URL}}/api/v1/auth/logout"
  auth:
    type: bearer
    token: "{{userToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
