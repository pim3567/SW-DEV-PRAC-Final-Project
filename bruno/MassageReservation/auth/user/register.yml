info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/api/v1/auth/register"
  body:
    type: json
    data: |-
      {
          "name": "User01",
          "tel": "0898765432",
          "email": "user01@gmail.com",
          "password": "12345678",
          "role": "user"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.role
      operator: eq
      value: user

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
