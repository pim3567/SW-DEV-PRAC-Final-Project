info:
  name: DeleteClosingDate
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{URL}}/api/v1/closing-dates/{{closingDateId}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
