info:
  name: GetClosingDates
  type: http
  seq: 2

http:
  method: GET
  url: "{{URL}}/api/v1/shops/{{shopId}}/closing-dates"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.success
      operator: eq
      value: "true"
    - expression: res.body.count
      operator: gte
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
