info:
  name: CreateShop
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/api/v1/shops"
  body:
    type: json
    data: |-
      {
        "name": "Sabai Massage",
        "address": "456 Bangkok Road",
        "tel": "0891234567",
        "description": "Thai massage and foot massage",
        "openingTime": "09:00",
        "closingTime": "21:00"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.success
      operator: eq
      value: "true"
    - expression: res.body.data.name
      operator: eq
      value: Sabai Massage

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
